name: Check DeepSeek's published prices

# Why this exists.
#
# `deepseek.json` is a transcription of pages DeepSeek owns. Transcribing them by hand is the one
# step here that can go wrong without looking wrong: a mistyped digit produces a config that reads
# perfectly plausibly, the app accepts it, and every user sees the wrong price. This job removes
# the transcription.
#
# It **opens a pull request, it does not commit**. The app's own validation rejects a change over
# 20x, which catches a slipped decimal point but not a subtle mistake -- `4` becoming `40` is 10x
# and sails through. The reviewer's glance at the diff is the check that actually holds, and it
# costs seconds compared with editing the JSON by hand.
#
# It does not affect the app's network promise. Fetching happens here, on GitHub's runners; the
# app still only makes a request when its own settings say to.
#
# Two readers, and why.
#
# The regex parser in `.github/scripts/sync-prices.py` is exact and fails loudly, but every one of
# its anchors is a place where a restyled page stops the sync. A model reading the same page does
# not care about layout -- and cannot be trusted not to invent a figure. So the model produces the
# reading and `apply-ai-prices.py` gates it twice: every number must be printed on the page it was
# said to come from (grounding), and the parser must have read the same page the same way (the
# independent second reading). A fabricated number fails the first; a number that is real but in
# the wrong column fails the second. See that script's docstring.

on:
  schedule:
    # Daily. Prices change rarely, and an off-the-hour minute keeps this out of the rush that
    # every other scheduled job in the world joins.
    - cron: "37 8 * * *"   # TEMPORARY - revert to "23 6 * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Self-test. 'fabricate' tampers with the model's answer by a tenth of a
          cent after the fact. The run MUST FAIL - the number is on no page. A green run here
          means the gate is not doing anything."
        required: false
      # The push half of the credential change, which is the half that can silently stop the
      # one thing this repository does. `persist-credentials: false` takes the credential out of
      # `.git/config`, and `git push` authenticates from exactly that key - so the push step now
      # installs it itself. If that does not work, every price change stops opening a pull
      # request while every run still reports success. The only way to know is to push into a
      # scratch branch and delete it.
      pushcheck:
        description: "Self-test. Push into a throwaway branch to prove the re-installed
          credential still works, then delete it. Nothing touches main."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @github/copilot

      # No third-party Python dependencies: both the fetch and the parser use the standard
      # library, so there is nothing to install and nothing to pin.
      - name: Fetch both language editions and render the prompt
        run: |
          python3 - <<'PY'
          import importlib.util, re, html
          spec = importlib.util.spec_from_file_location("sp", ".github/scripts/sync-prices.py")
          sp = importlib.util.module_from_spec(spec); spec.loader.exec_module(sp)

          # The raw HTML is kept, not just the flattened text: the parser needs the table
          # elements. The model gets the flattened form, and grounding runs against that same
          # form, so a number buried in an attribute or a script tag cannot pass as "printed".
          pages = {"en": sp.get(sp.EN), "zh": sp.get(sp.ZH)}
          for name, raw in pages.items():
              open(f"page-{name}.html", "w", encoding="utf-8").write(raw)

          def flatten(doc):
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", doc)))

          tpl = open(".github/prompts/price-config.txt").read()
          prompt = tpl.replace("{{page_en}}", flatten(pages["en"]))
          prompt = prompt.replace("{{page_zh}}", flatten(pages["zh"]))
          assert "{{" not in prompt, "a placeholder was left unsubstituted"
          open("full-prompt.txt", "w", encoding="utf-8").write(prompt)
          print(f"en {len(pages['en'])} bytes, zh {len(pages['zh'])} bytes, prompt {len(prompt)} chars")
          PY

      # Every step so far is ours. The steps below read a page DeepSeek controls, and that page is
      # untrusted input: if it ever carries text aimed at the reader rather than at a human, the
      # reader is what gets injected.
      #
      # Measured 2026-09-15, `probe-injection.yml` on the test branch. A model reading a page CAN
      # run shell commands and report their output back (Control B). It cannot see `COPILOT_PAT`
      # - the CLI strips secret-shaped variables out of the shell it hands the model, while
      # leaving ordinary ones in place (Controls C and D). But `actions/checkout` had left this
      # run's own GITHUB_TOKEN sitting in `.git/config`, and the reader could read that (Control
      # G returned 1): a reader that can run commands, holding a token with `contents: write`.
      #
      # So checkout is told not to leave one. With `persist-credentials: false` the token is
      # never written to `.git/config` at all, for any step, and the step that pushes sets it
      # for itself. Nothing to remove means nothing to forget to remove.
      #
      # Invoked directly rather than through `actions/ai-inference`. That action reports success
      # and produces no output when the file it was told to attach never reaches the model -
      # measured while this was being built. The step passed, the log said nothing, and the model
      # had answered from memory. Calling the CLI puts stdout and stderr in the log.
      - name: Ask the model to read both pages
        id: ai
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          set -uo pipefail
          copilot -p "$(cat full-prompt.txt)" -s --no-ask-user --model auto \
            > facts.json 2> ai-stderr.txt
          echo "copilot exit=$?  facts=$(wc -c < facts.json) bytes  stderr=$(wc -c < ai-stderr.txt) bytes"
          head -c 1200 facts.json
          echo
          head -c 800 ai-stderr.txt

      - name: Self-test — tamper with the model's answer
        if: inputs.selftest == 'fabricate'
        run: |
          python3 - <<'PY'
          import json
          facts = json.load(open("facts.json"))
          was = facts["models"][0]["USD"]["inputCacheHit"]["offPeak"]
          now = round(was + 0.0001, 10)
          facts["models"][0]["USD"]["inputCacheHit"]["offPeak"] = now
          json.dump(facts, open("facts.json", "w"))
          print(f"SELF-TEST: {was} -> {now}. That number is on no page. The gate must refuse.")
          PY

      - name: Ground the reading in the pages, and write the config
        run: |
          set -uo pipefail
          code=0
          python3 .github/scripts/apply-ai-prices.py || code=$?
          case "$code" in
            0) ;;
            1) exit 1 ;;   # refused - the reading cannot be trusted, nothing was written
            2) echo "::warning::only one reader could read the page this run" ;;
            *) exit "$code" ;;
          esac

      # The model path is the one this job exists for, but a model outage must not hold up a
      # price fix -- that would let an unrelated failure stop the one thing this repository does.
      # Falling back is therefore allowed, and it is announced rather than done quietly.
      #
      # `success()` is explicit rather than implied, and it is load-bearing. A step that carries
      # an `if:` does NOT inherit the usual "only run if everything so far passed" rule - so
      # without it, a run where the gate refused would fall through to here and write the very
      # config the gate had just rejected.
      - name: Fall back to the regex parser alone
        if: success() && steps.ai.outcome != 'success'
        run: |
          echo "::warning::the model did not answer; this sync used the regex parser alone"
          python3 .github/scripts/sync-prices.py

      - name: Open a pull request if anything moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- deepseek.json; then
            echo "nothing moved; no pull request"
            exit 0
          fi

          # Put the credential back for the push.
          #
          # `actions/checkout` now runs with `persist-credentials: false`, so nothing in this
          # job has a credential in `.git/config` - which is the point, because the step above
          # hands a page we do not control to a reader that can run shell commands. But
          # `git push` authenticates from exactly that config key and nothing else; `GH_TOKEN`
          # in the environment only reaches `gh`, not `git`. Without this line the push fails
          # with a 403 that reads like a permissions problem on the branch.
          #
          # Re-installed here, after the reader is done, and scoped to this one step: the
          # window in which it exists is the window in which no untrusted input is being read.
          git config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"

          branch="price-sync/$(date -u +%Y%m%d)"
          title="Price sync: DeepSeek's published figures have changed"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add deepseek.json
          git commit -m "${title}" -m "$(cat PR_BODY.md)"
          git push -u origin "${branch}"

          # `gh pr create` fails when a pull request for this branch is already open, which is the
          # state a re-run lands in. Tolerate exactly that, and nothing else.
          #
          # The first version of this step ended in `|| echo "already open"`, which swallowed every
          # failure. It was written that way precisely because it looked tidy — and it hid a real
          # one: this repository has `can_approve_pull_request_reviews: false`, so `GITHUB_TOKEN`
          # may not open pull requests at all. The run reported success while producing no PR.
          # A workflow that cannot do its one job must say so.
          if ! output="$(gh pr create --title "${title}" --body-file PR_BODY.md \
                           --base main --head "${branch}" 2>&1)"; then
            case "${output}" in
              *"already exists"*)
                echo "a pull request for ${branch} is already open" ;;
              *)
                echo "::error::gh pr create failed — ${output}"
                exit 1 ;;
            esac
          else
            echo "${output}"
          fi

      - name: Fail loudly if nothing could read the page
        if: failure()
        run: |
          echo "::error::Could not read DeepSeek's pricing page. This is not a price change --" \
                "the page most likely changed shape, and the reader needs updating." \
                "Nothing was written."

  # Runs only when asked. It writes nothing to the repository and deletes what it creates - its
  # whole purpose is to fail loudly if the push mechanism broke, rather than quietly a day later
  # when a price actually changes.
  push-mechanism:
    if: inputs.pushcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm no credential was persisted
        run: |
          set -euo pipefail
          if git config --get-regexp 'http\..*extraheader' >/dev/null 2>&1; then
            echo "::error::checkout persisted a credential despite persist-credentials: false"
            exit 1
          fi
          echo "no credential in .git/config, as intended - this is the state the reader runs in"

      - name: Reinstall it the way the push step does, then push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"

          branch="selfcheck-scratch-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git commit --allow-empty -m "self-check: does the reinstalled credential still push"
          git push -u origin "${branch}"
          echo "pushed ${branch} - the mechanism works"

      - name: Delete the scratch branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git push origin --delete "selfcheck-scratch-${GITHUB_RUN_ID}" || \
            echo "::warning::could not delete selfcheck-scratch-${GITHUB_RUN_ID}; remove it by hand"
