# 临时探针：验证 GitHub 到底会不会执行 schedule 触发。
# 新建的 workflow 会被重新注册，所以它能区分
# 「GitHub 不执行定时任务」和「改了 cron 但注册表没更新」。
# 验证完即删。
name: PROBE schedule
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "schedule 触发成功，事件=${{ github.event_name }}，时间=$(date -u)"
